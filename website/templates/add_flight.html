{% extends "base.html" %}

{% block content %}
<h1>Add a New Flight</h1>
<form action="{{ url_for('views.add_flight') }}" method="post">
    <label for="origin">Origin:</label>
    <input type="text" name="origin" id="origin" required><br><br>

    <label for="destination">Destination:</label>
    <input type="text" name="destination" id="destination" required><br><br>

    <label for="departure_date">Departure Date:</label>
    <input type="date" name="departure_date" id="departure_date" required><br><br>

    <label for="price">Price (USD):</label>
    <input type="number" step="0.01" name="price" id="price"><br><br>

    <input type="submit" value="Add Flight">
</form>

<br>
<a href="{{ url_for('views.home') }}">Back to Home</a>
{% endblock %}
